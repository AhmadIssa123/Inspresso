[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspresso"
version = "0.1.0"
description = "Prototype software for the Inspresso espresso shot analyzer."
requires-python = ">=3.10"
authors = [
  { name = "Ahmad Issa" }
]

[tool.setuptools.packages.find]
where = ["src"]
